
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Account | Bethel Cakes</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --wine: #6d1025;
            --wine-dark: #4b0718;
            --wine-light: #8f2940;
            --cream: #fffaf5;
            --cream-dark: #f4e8df;
            --gold: #c9a45c;
            --gold-light: #e6cc91;
            --text: #2f2023;
            --muted: #806f72;
            --white: #ffffff;
            --green: #367354;
            --red: #a52a3d;
        }

        body {
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: var(--text);

            background:
                radial-gradient(
                    circle at top left,
                    rgba(201, 164, 92, 0.18),
                    transparent 30%
                ),
                radial-gradient(
                    circle at bottom right,
                    rgba(109, 16, 37, 0.13),
                    transparent 35%
                ),
                var(--cream);
        }

        button,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        a {
            color: inherit;
            text-decoration: none;
        }


        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            position: sticky;
            top: 18px;
            z-index: 50;

            width: min(
                calc(100% - 32px),
                1180px
            );

            margin: 18px auto 0;

            padding: 12px 16px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background:
                rgba(255, 250, 245, 0.93);

            border: 1px solid
                rgba(109, 16, 37, 0.10);

            box-shadow:
                0 18px 45px
                rgba(70, 27, 37, 0.10);

            backdrop-filter: blur(18px);

            border-radius: 999px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 48px;
            height: 48px;

            object-fit: cover;

            border-radius: 16px;

            border: 1px solid
                rgba(201, 164, 92, 0.45);
        }

        .brand-name {
            color: var(--wine);

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 20px;
            font-weight: bold;
        }

        .brand-tagline {
            display: block;

            margin-top: 2px;

            color: var(--muted);

            font-size: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-button {
            border: none;

            padding: 11px 17px;

            border-radius: 999px;

            background: transparent;

            color: var(--wine);

            font-size: 13px;
            font-weight: bold;
        }

        .nav-button:hover {
            background: var(--cream-dark);
        }

        .logout-button {
            background: var(--wine);
            color: var(--white);
        }

        .logout-button:hover {
            background: var(--wine-light);
        }


        /* =========================
           MAIN
        ========================= */

        .page {
            width: min(
                1080px,
                calc(100% - 32px)
            );

            margin: 0 auto;

            padding:
                70px 0 90px;
        }


        /* =========================
           HERO
        ========================= */

        .hero {
            position: relative;

            overflow: hidden;

            padding:
                48px;

            margin-bottom: 24px;

            border-radius: 40px;

            background:
                linear-gradient(
                    135deg,
                    var(--wine-dark),
                    var(--wine),
                    #81223a
                );

            color: var(--white);

            box-shadow:
                0 28px 70px
                rgba(78, 10, 28, 0.22);
        }

        .hero::after {
            content: "";

            position: absolute;

            width: 330px;
            height: 330px;

            right: -150px;
            top: -150px;

            border-radius: 50%;

            border: 1px solid
                rgba(230, 204, 145, 0.25);
        }

        .hero-content {
            position: relative;
            z-index: 2;
        }

        .eyebrow {
            display: inline-block;

            margin-bottom: 17px;

            padding: 8px 13px;

            border: 1px solid
                rgba(230, 204, 145, 0.35);

            border-radius: 999px;

            color: var(--gold-light);

            font-size: 10px;
            font-weight: bold;

            letter-spacing: 2px;

            text-transform: uppercase;
        }

        .hero h1 {
            margin-bottom: 13px;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size:
                clamp(38px, 5vw, 62px);

            font-weight: normal;
        }

        .hero h1 span {
            color: var(--gold-light);
        }

        .hero p {
            max-width: 680px;

            color:
                rgba(255, 255, 255, 0.76);

            line-height: 1.75;

            font-size: 15px;
        }


        /* =========================
           GRID
        ========================= */

        .dashboard-grid {
            display: grid;

            grid-template-columns:
                0.8fr
                1.2fr;

            gap: 24px;
        }

        .card {
            padding: 32px;

            background:
                rgba(255, 255, 255, 0.87);

            border: 1px solid
                rgba(109, 16, 37, 0.09);

            border-radius: 34px;

            box-shadow:
                0 22px 55px
                rgba(70, 27, 37, 0.09);

            backdrop-filter: blur(16px);
        }

        .card h2 {
            margin-bottom: 8px;

            color: var(--wine);

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 27px;

            font-weight: normal;
        }

        .card-description {
            margin-bottom: 25px;

            color: var(--muted);

            font-size: 13px;

            line-height: 1.7;
        }


        /* =========================
           PROFILE
        ========================= */

        .profile-icon {
            width: 68px;
            height: 68px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 20px;

            border-radius: 23px;

            background:
                linear-gradient(
                    135deg,
                    var(--cream-dark),
                    #f9eee5
                );

            color: var(--wine);

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 29px;
        }

        .profile-row {
            padding: 16px 0;

            border-bottom: 1px solid
                rgba(109, 16, 37, 0.08);
        }

        .profile-row:last-child {
            border-bottom: none;
        }

        .profile-label {
            display: block;

            margin-bottom: 5px;

            color: var(--muted);

            font-size: 10px;

            letter-spacing: 1.3px;

            text-transform: uppercase;
        }

        .profile-value {
            color: var(--text);

            font-size: 14px;
            font-weight: bold;

            overflow-wrap: anywhere;
        }

        .verified {
            display: inline-flex;
            align-items: center;

            margin-top: 7px;

            padding: 5px 9px;

            border-radius: 999px;

            background:
                rgba(54, 115, 84, 0.10);

            color: var(--green);

            font-size: 10px;
            font-weight: bold;
        }


        /* =========================
           REVIEW
        ========================= */

        .review-status {
            display: none;

            margin-bottom: 20px;

            padding: 14px 16px;

            border-radius: 16px;

            font-size: 13px;

            line-height: 1.5;
        }

        .review-status.show {
            display: block;
        }

        .review-status.pending {
            background:
                rgba(201, 164, 92, 0.12);

            color: #755719;
        }

        .review-status.approved {
            background:
                rgba(54, 115, 84, 0.10);

            color: var(--green);
        }

        .review-status.error {
            background:
                rgba(165, 42, 61, 0.09);

            color: var(--red);
        }

        .stars {
            display: flex;
            gap: 8px;

            margin-bottom: 18px;
        }

        .star {
            width: 43px;
            height: 43px;

            border: 1px solid
                rgba(109, 16, 37, 0.12);

            border-radius: 14px;

            background: var(--cream);

            color: #c9bfc0;

            font-size: 20px;

            transition:
                background 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease;
        }

        .star:hover {
            transform: translateY(-2px);
        }

        .star.selected {
            background:
                rgba(201, 164, 92, 0.16);

            color: var(--gold);

            border-color:
                rgba(201, 164, 92, 0.35);
        }

        .rating-label {
            margin-bottom: 20px;

            color: var(--muted);

            font-size: 12px;
        }

        textarea {
            width: 100%;

            min-height: 150px;

            resize: vertical;

            padding: 16px;

            border: 1px solid
                rgba(109, 16, 37, 0.13);

            border-radius: 19px;

            outline: none;

            background: var(--cream);

            color: var(--text);

            line-height: 1.6;

            font-size: 14px;
        }

        textarea:focus {
            border-color: var(--wine);

            box-shadow:
                0 0 0 4px
                rgba(109, 16, 37, 0.07);
        }
